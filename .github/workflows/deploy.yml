name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # <--- FIX 1: Caches dependencies to drop build time from 3+ mins to seconds

      - name: Install Dependencies
        run: npm ci # <--- FIX 2: Cleaner, faster installations intended strictly for automated CI pipelines

      - name: Build React Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3 # <--- FIX 3: Reverting to v3 avoids the compression queue stall bugs found in v4 setups
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
